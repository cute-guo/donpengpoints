<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>整装市场中心绩效管理系统</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i data-lucide="bar-chart-3"></i>
        </div>
        <div>
          <div class="sidebar-title">绩效管理系统</div>
          <div class="sidebar-subtitle">整装市场中心</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">绩效项目</div>
        <div id="navList"></div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">管</div>
          <div class="user-details">
            <div class="user-name">管理员</div>
            <div class="user-role">绩效管理员</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶部栏 -->
      <header class="header">
        <div class="header-left">
          <div class="menu-toggle" id="menuToggle">
            <i data-lucide="menu"></i>
          </div>
          <div class="breadcrumb">
            <span>绩效管理</span>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current" id="currentProjectName">355目标</span>
          </div>
        </div>
        <div class="header-right">
          <span class="header-time" id="currentTime"></span>
          <button class="btn btn-primary" onclick="openUpdateModal()">
            <i data-lucide="plus"></i>
            更新数据
          </button>
        </div>
      </header>

      <!-- 页面内容 -->
      <div class="page-content" id="pageContent">
        <!-- 导航首页 -->
        <div class="home-page" id="homePage">
          <div class="home-header">
            <div class="home-title-section">
              <h1 class="home-title">整装市场中心绩效总览</h1>
              <p class="home-subtitle" id="currentDate"></p>
            </div>
          </div>
          
          <!-- 季度/年度切换 -->
          <div class="period-tabs">
            <button class="period-tab active" data-period="quarter" onclick="switchPeriod('quarter')">
              <i data-lucide="calendar-range"></i>
              <span>当季完成情况</span>
            </button>
            <button class="period-tab" data-period="year" onclick="switchPeriod('year')">
              <i data-lucide="calendar"></i>
              <span>年度累计完成</span>
            </button>
          </div>
          
          <!-- 季度数据 -->
          <div class="period-content active" id="quarterContent">
            <div class="period-summary">
              <div class="period-stat">
                <span class="period-stat-value" id="quarterTotal">0</span>
                <span class="period-stat-label">季度总目标</span>
              </div>
              <div class="period-stat">
                <span class="period-stat-value text-success" id="quarterCompleted">0</span>
                <span class="period-stat-label">已完成</span>
              </div>
              <div class="period-stat">
                <span class="period-stat-value" id="quarterRate">0%</span>
                <span class="period-stat-label">完成率</span>
              </div>
              <div class="period-stat">
                <span class="period-stat-value text-warning" id="quarterRemaining">0</span>
                <span class="period-stat-label">剩余目标</span>
              </div>
            </div>
            <div class="region-grid" id="quarterRegionGrid"></div>
          </div>
          
          <!-- 年度数据 -->
          <div class="period-content" id="yearContent" style="display: none;">
            <div class="period-summary">
              <div class="period-stat">
                <span class="period-stat-value" id="yearTotal">0</span>
                <span class="period-stat-label">年度总目标</span>
              </div>
              <div class="period-stat">
                <span class="period-stat-value text-success" id="yearCompleted">0</span>
                <span class="period-stat-label">已完成</span>
              </div>
              <div class="period-stat">
                <span class="period-stat-value" id="yearRate">0%</span>
                <span class="period-stat-label">完成率</span>
              </div>
              <div class="period-stat">
                <span class="period-stat-value text-warning" id="yearRemaining">0</span>
                <span class="period-stat-label">剩余目标</span>
              </div>
            </div>
            <div class="region-grid" id="yearRegionGrid"></div>
          </div>
          
          <div class="projects-grid" id="projectsGrid"></div>
        </div>

        <!-- 详情页（默认隐藏） -->
        <div class="detail-page" id="detailPage" style="display: none;">
          <!-- 概览卡片 -->
          <div class="overview-cards" id="overviewCards"></div>

          <!-- 筛选栏 -->
          <div class="filter-bar">
            <div class="filter-group">
              <span class="filter-label">月份：</span>
              <select class="filter-select" id="monthFilter" onchange="handleMonthChange(this.value)">
                <option value="3">3月（当前）</option>
                <option value="1">1月</option>
                <option value="2">2月</option>
                <option value="4">4月</option>
                <option value="5">5月</option>
                <option value="6">6月</option>
                <option value="7">7月</option>
                <option value="8">8月</option>
                <option value="9">9月</option>
                <option value="10">10月</option>
                <option value="11">11月</option>
                <option value="12">12月</option>
              </select>
            </div>

            <div class="filter-group">
              <span class="filter-label">区域：</span>
              <select class="filter-select" id="regionFilter" onchange="handleRegionFilter(this.value)">
                <option value="all">全部区域</option>
              </select>
            </div>

            <div class="filter-status">
              <span class="status-tag active" data-status="all" onclick="handleStatusFilter('all')">全部</span>
              <span class="status-tag" data-status="normal" onclick="handleStatusFilter('normal')">正常</span>
              <span class="status-tag warning" data-status="warning" onclick="handleStatusFilter('warning')">预警</span>
              <span class="status-tag danger" data-status="danger" onclick="handleStatusFilter('danger')">危险</span>
            </div>

            <div class="filter-actions">
              <button class="btn btn-secondary" onclick="showHomePage()">
                <i data-lucide="home"></i>
                返回首页
              </button>
              <button class="btn btn-secondary" onclick="refreshData()">
                <i data-lucide="refresh-cw"></i>
                刷新
              </button>
            </div>
          </div>

          <!-- 数据表格区域 -->
          <div id="dataTables"></div>

          <!-- 图表区域 -->
          <div class="charts-grid" id="chartsGrid">
            <div class="chart-card">
              <div class="chart-title">区域完成率对比</div>
              <div class="chart-container">
                <canvas id="regionChart"></canvas>
              </div>
            </div>
            <div class="chart-card">
              <div class="chart-title">状态分布</div>
              <div class="chart-container">
                <canvas id="statusChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 更新数据模态框 -->
  <div class="modal-overlay" id="updateModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">更新绩效数据</h3>
        <div class="modal-close" onclick="closeUpdateModal()">
          <i data-lucide="x"></i>
        </div>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">选择区域</label>
          <select class="form-input" id="updateRegion">
            <option value="">请选择区域</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">选择线组</label>
          <select class="form-input" id="updateTeam">
            <option value="">请先选择区域</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">目标值</label>
            <input type="number" class="form-input" id="updateTarget" placeholder="输入目标值">
          </div>
          <div class="form-group">
            <label class="form-label">完成值</label>
            <input type="number" class="form-input" id="updateCompleted" placeholder="输入完成值">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">计算完成率</label>
          <div class="cell-value large" id="calculatedRate">-- %</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeUpdateModal()">取消</button>
        <button class="btn btn-primary" onclick="saveUpdate()">保存</button>
      </div>
    </div>
  </div>

  <!-- 预警详情模态框 -->
  <div class="modal-overlay" id="warningModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">预警详情</h3>
        <div class="modal-close" onclick="closeWarningModal()">
          <i data-lucide="x"></i>
        </div>
      </div>
      <div class="modal-body" id="warningDetailBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeWarningModal()">关闭</button>
        <button class="btn btn-primary" onclick="markWarningHandled()">标记已处理</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.321.0/dist/umd/lucide.min.js"></script>
  <script src="data/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
